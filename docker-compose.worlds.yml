# ADR-019: ordinary Compose projects, one named data volume per world.
# Config validation is not launch/gameplay acceptance. Before up, prepare the
# selected volume's /runtime, /manifests/agents.json, schema and private accounts.
# RATHENA_IMAGE must be the new pinned playable image, NOT the legacy Dockerfile.
# Ruleset selection describes prepared runtime/image inputs; it does not rebuild
# the image or implement Renewal. Images must support the configured paths.
name: ${WORLD_PROJECT:?derived world project required}

x-world-env: &world-env
  WORLD_KIND: ${WORLD_KIND:?selected world required}
  WORLD_RULESET: ${WORLD_RULESET:-pre-renewal}

x-rathena: &rathena
  image: ${RATHENA_IMAGE:?pinned playable rAthena image required}
  working_dir: /world/runtime
  environment:
    <<: *world-env
    RATHENA_RUNTIME_ROOT: /world/runtime
    RATHENA_LOG_ROOT: /world/logs/rathena
  volumes:
    - world-data:/world
  depends_on:
    mariadb:
      condition: service_healthy

services:
  mariadb:
    image: mariadb:11.4
    command: ["--datadir=/var/lib/ro-bots/db", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      <<: *world-env
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/world-db-root
      MARIADB_DATABASE: ${WORLD_DB_NAME:-ragnarok}
      MARIADB_USER: ${WORLD_DB_USER:?explicit world-owned database user required}
      MARIADB_PASSWORD_FILE: /run/secrets/world-db-user
    secrets: [world-db-root, world-db-user]
    volumes:
      - world-data:/var/lib/ro-bots
      # Prepared schema + private interserver-account SQL. Keep this directory
      # private; the official entrypoint imports it only on a fresh datadir.
      - type: bind
        source: ${WORLD_SCHEMA_DIR:?prepared private bootstrap SQL directory required}
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    ports: []
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  rathena-login:
    <<: *rathena
    entrypoint: ["/libexec/rathena/login-server"]
    command: ["--runtime-root", "/world/runtime"]
    ports: ["127.0.0.1:${WORLD_LOGIN_PORT:-6900}:${WORLD_LOGIN_PORT:-6900}"]
  rathena-char:
    <<: *rathena
    entrypoint: ["/libexec/rathena/char-server"]
    command: ["--runtime-root", "/world/runtime"]
    ports: ["127.0.0.1:${WORLD_CHAR_PORT:-6121}:${WORLD_CHAR_PORT:-6121}"]
  rathena-map:
    <<: *rathena
    entrypoint: ["/libexec/rathena/map-server"]
    command: ["--runtime-root", "/world/runtime"]
    ports: ["127.0.0.1:${WORLD_MAP_PORT:-5121}:${WORLD_MAP_PORT:-5121}"]

  agent:
    image: ${AGENT_IMAGE:?agent host image required}
    command: ["python", "-m", "robots", "--manifest", "/world/manifests/agents.json", "--memory-root", "/world/memory/agents", "--worldfeed-port", "8402"]
    environment:
      <<: *world-env
      AGENT_LOG_ROOT: /world/logs/agents
    volumes: ["world-data:/world"]
    depends_on: [rathena-map]

  worldfeed:
    # Supplied real service image owns its entrypoint. No source mount, demo
    # state or stub fallback. Integration with the active host is not proved here.
    image: ${WORLDFEED_IMAGE:?real WorldFeed image required}
    environment:
      <<: *world-env
      WORLDFEED_PORT: "8400"
      AGENT_WORLDFEED_URL: http://agent:8402
      WORLDFEED_MEMORY_ROOT: /world/memory/worldfeed
      WORLDFEED_LOG_ROOT: /world/logs/worldfeed
    volumes: ["world-data:/world"]
    ports: ["127.0.0.1:${WORLD_FEED_PORT:-8400}:8400"]
    depends_on: [agent]

  dashboard:
    image: ${DASHBOARD_IMAGE:?dashboard image required}
    environment:
      <<: *world-env
      DASHBOARD_BIND: 0.0.0.0:8400
      WORLD_FEED_URL: http://worldfeed:8400
    ports: ["127.0.0.1:${WORLD_DASHBOARD_PORT:-8401}:8400"]
    depends_on: [worldfeed]

secrets:
  world-db-root:
    file: ${WORLD_DB_ROOT_SECRET_FILE:?explicit private root secret file required}
  world-db-user:
    file: ${WORLD_DB_USER_SECRET_FILE:?explicit private world-user secret file required}
volumes:
  world-data:
    name: ${WORLD_VOLUME:?derived world volume required}
# Omit networks: Compose supplies the ordinary project-scoped default bridge.
