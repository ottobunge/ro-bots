[project]
name = "ro-bots"
version = "0.1.0"
description = "Clef-driven bot players for a private rAthena Ragnarok Online server"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "black>=25",
    "ruff>=0.14",
    "mypy>=1.18",
    "bandit>=1.8",
    "vulture>=2.14",
    "xenon>=0.9",
    "pylint>=4",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robots"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle (formatting overlaps black; F/E9 catch real breakage)
    "F",         # pyflakes
    "I",         # import order
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplification
    "RET",       # return hygiene
    "ARG",       # unused arguments
    "DTZ",       # datetime safety
    "EM",        # exception message hygiene
    "ISC",       # implicit string concat
    "PIE",       # misc correctness
    "T20",       # no print in library code
    "PT",        # pytest style
    "RUF",       # ruff-specific (incl. RUF100: unused noqa)
    "C4",        # comprehensions
    "PL",        # pylint rules ported to ruff
]
ignore = [
    "PLR0913",   # many args is normal for typed dataclass constructors
    "PLR2004",   # magic values are fine in a game domain
]

[tool.ruff.lint.per-file-ignores]
# Test doubles and fakes must accept (and ignore) arguments to satisfy ports.
"tests/**" = ["ARG002", "ARG001"]
"src/robots/adapters/**/stub.py" = ["ARG002"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
# Test fixtures arrive untyped from pytest fixtures; keep strictness on src.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B311"]  # random.* is used for behavior jitter, never for secrets

[tool.vulture]
min_confidence = 85
paths = ["src", "vulture_whitelist.py"]

[tool.pylint.main]
disable = "all"
enable = "duplicate-code"
ignore-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/robots"]
