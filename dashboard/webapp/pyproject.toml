[project]
name = "ro-bots-dashboard-webapp"
version = "0.1.0"
description = "Agent-tracking + run-visibility web dashboard for the ro-bots experiment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=25",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_webapp"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "ARG", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test doubles accept (and ignore) unused args to satisfy the source protocols.
"tests/**" = ["ARG002", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
