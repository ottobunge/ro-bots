version: '3'

tasks:
  dashboard:fmt:
    desc: Format check (rustfmt)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo fmt --all -- --check

  dashboard:clippy:
    desc: Clippy, pedantic group, all targets/features, deny warnings
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  dashboard:test:
    desc: Unit tests (contract round-trips, determinism, HTTP API)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo test

  dashboard:audit:
    desc: Dependency audit (pinned Nix cargo-audit)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo audit -D warnings

  dashboard:machete:
    desc: Unused-dependency check (pinned Nix cargo-machete)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo machete

  dashboard:doc:
    desc: Prove docs build (rustdoc, no deps)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo doc --no-deps

  dashboard:check:
    desc: All quality gates (fmt + clippy + test + audit + machete + doc)
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - dashboard:fmt
      - dashboard:clippy
      - dashboard:test
      - dashboard:audit
      - dashboard:machete
      - dashboard:doc

  dashboard:serve:
    desc: Run live dashboard locally on 127.0.0.1:8401
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cargo run --release
