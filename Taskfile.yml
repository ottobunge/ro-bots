version: '3'

env:
  UV: uv

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  sync:
    desc: Create/refresh the uv-managed virtualenv with all deps
    cmds:
      - uv sync --all-groups

  format:
    desc: Format code (black) and fix imports/order (ruff)
    cmds:
      - uv run black src tests
      - uv run ruff check --fix --unsafe-fixes src tests

  lint:ruff:
    desc: Ruff lint (style, bugs, complexity, unused, noqa hygiene)
    cmds:
      - uv run ruff check src tests

  lint:mypy:
    desc: mypy strict type check
    cmds:
      - uv run mypy

  lint:dead:
    desc: Dead code / unused code detection (vulture)
    cmds:
      - uv run vulture src vulture_whitelist.py

  lint:complexity:
    desc: Complexity guard (xenon, fail above B/6/60)
    cmds:
      - uv run xenon src --max-absolute B --max-modules B --max-average A

  lint:dup:
    desc: Duplicate code detection (pylint duplicate-code)
    cmds:
      - uv run pylint --disable=all --enable=duplicate-code --ignore-paths=tests src

  lint:security:
    desc: Security lint (bandit)
    cmds:
      - uv run bandit -q -c pyproject.toml -r src

  audit:
    desc: Audit dependencies for known CVEs (pip-audit)
    cmds:
      - uv export --format requirements-txt --all-groups --no-emit-project -o .audit-requirements.txt
      - uv run --with-requirements .audit-requirements.txt pip-audit --strict --disable-pip -r .audit-requirements.txt
      - rm -f .audit-requirements.txt

  lint:
    desc: All static analysis
    deps:
      - lint:ruff
      - lint:mypy
      - lint:dead
      - lint:complexity
      - lint:dup
      - lint:security

  test:
    desc: Unit tests with coverage
    cmds:
      - uv run pytest --cov=src/robots --cov-report=term-missing --cov-fail-under=85

  quality:
    desc: format + lint + test + audit (run before every commit/push)
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: audit

  check:
    desc: Non-mutating gate for CI (no --fix, no rewrite)
    cmds:
      - uv run black --check src tests
      - task: lint
      - task: test

  run:clef:
    desc: Start the local Clef SystemOne service (spike 001)
    dir: spikes/001-clef-local
    cmds:
      - ./serve.sh

  # ---- ADR-010: worlds / volumes / e2e playground -------------------------
  # Ordinary per-world Compose projects/volumes (ADR-019).
  # Runtime/schema/images must be prepared; full E2E remains unfinished.

  world:inspect:
    desc: 'Read-only test-world resource listing; not authorization for seed/reset'
    cmds:
      - docker container ls --all --quiet --no-trunc --filter label=com.docker.compose.project=ro-bots-test
      - docker volume ls --quiet --filter 'name=^ro-bots-world-test$'

  world:inventory:
    desc: 'Read-only exact test-volume/container inventory; no mutation authorization'
    cmds:
      - uv run python -m robots.adapters.world_inventory

  world:prepare:
    desc: 'Prepare new private host runtime/bootstrap files; no containers or SQL executed'
    env:
      WORLD: '{{.world | default "debug"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh prepare --world "$WORLD"

  world:config:
    desc: 'Render selected-world Compose configuration without engine changes'
    env:
      WORLD: '{{.world | default "debug"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh config --world "$WORLD"

  world:up:
    desc: 'Start selected Compose world; requires prepared runtime/schema and loaded images'
    env:
      WORLD: '{{.world | default "debug"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh up --world "$WORLD"

  world:down:
    desc: 'Stop selected Compose world, preserving its persistent data volume'
    env:
      WORLD: '{{.world | default "debug"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh down --world "$WORLD"

  world:wipe:
    desc: 'Stop and remove only the test data volume; debug/production refused'
    env:
      WORLD: '{{.world | default "test"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh wipe --world "$WORLD"

  world:status:
    desc: 'Read-only selected Compose world service status'
    env:
      WORLD: '{{.world | default "debug"}}'
      WORLD_STAGE: '{{.stage | default ""}}'
    cmds:
      - bash scripts/world.sh status --world "$WORLD"

  e2e-prepare:
    desc: 'Stage the private e2e world files (runtime confs at ports 26900/26121/25121, bootstrap SQL, secrets, compose inputs); no containers'
    cmds:
      - bash scripts/e2e/prepare.sh

  e2e-up:
    desc: 'Clean isolated e2e world: compose project ro-bots-e2e + volume ro-bots-e2e-world + ports 26900/26121/25121; refuses non-fresh state, verifies journal/DB/ports before returning'
    cmds:
      - bash scripts/e2e/up.sh

  e2e-init:
    desc: 'Verify imported schema + seed the default two-agent novice population (status_point 48, skill_point 9) with fresh DB readback'
    cmds:
      - bash scripts/e2e/init.sh

  e2e-run:
    desc: 'ONE bounded 300s agent window against the isolated world (window34 composition, heavengraph Clef, pacer 6s); receipt lands in .work/playing-grind-emission/evidence/'
    cmds:
      - bash scripts/e2e/run.sh

  e2e-assert:
    desc: 'Modest first bar over the newest receipt: exists, logins landed, a position changed OR decides happened; prints what ran'
    cmds:
      - bash scripts/e2e/assert.sh

  e2e-down:
    desc: 'Remove the e2e compose project + volume and verify both are gone (never touches ro-bots-test)'
    cmds:
      - bash scripts/e2e/down.sh

  e2e:
    desc: 'Full e2e cycle: clean world up -> init -> bounded run -> assert -> verified teardown'
    cmds:
      - task: e2e-down
      - task: e2e-up
      - task: e2e-init
      - task: e2e-run
      - task: e2e-assert
      - task: e2e-down

  playground:
    desc: 'BLOCKED: playground depends on a verified clean-world executor'
    cmds:
      - KEEP=1 bash scripts/e2e.sh


  bench:decisions:
    desc: Benchmark decision backends (ADR-012). Vars, e.g. backends=cloudflare-flash,cloudflare-27b runs=10
    vars:
      BACKENDS: "{{.backends | default \"cloudflare-flash,cloudflare-27b\"}}"
      RUNS: "{{.runs | default \"10\"}}"
    cmds:
      - cd spikes/bench && python3 bench_framework.py --backends {{.BACKENDS}} --runs {{.RUNS}} --json-out RESULTS.json
      - echo "Compare with spikes/bench/RESULTS.md (append notable rows there)"
