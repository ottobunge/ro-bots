version: '3'

env:
  UV: uv

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  sync:
    desc: Create/refresh the uv-managed virtualenv with all deps
    cmds:
      - uv sync --all-groups

  format:
    desc: Format code (black) and fix imports/order (ruff)
    cmds:
      - uv run black src tests
      - uv run ruff check --fix --unsafe-fixes src tests

  lint:ruff:
    desc: Ruff lint (style, bugs, complexity, unused, noqa hygiene)
    cmds:
      - uv run ruff check src tests

  lint:mypy:
    desc: mypy strict type check
    cmds:
      - uv run mypy

  lint:dead:
    desc: Dead code / unused code detection (vulture)
    cmds:
      - uv run vulture src vulture_whitelist.py

  lint:complexity:
    desc: Complexity guard (xenon, fail above B/6/60)
    cmds:
      - uv run xenon src --max-absolute B --max-modules B --max-average A

  lint:dup:
    desc: Duplicate code detection (pylint duplicate-code)
    cmds:
      - uv run pylint --disable=all --enable=duplicate-code --ignore-paths=tests src

  lint:security:
    desc: Security lint (bandit)
    cmds:
      - uv run bandit -q -c pyproject.toml -r src

  audit:
    desc: Audit dependencies for known CVEs (pip-audit)
    cmds:
      - uv export --format requirements-txt --all-groups --no-emit-project -o .audit-requirements.txt
      - uv run --with-requirements .audit-requirements.txt pip-audit --strict --disable-pip -r .audit-requirements.txt
      - rm -f .audit-requirements.txt

  lint:
    desc: All static analysis
    deps:
      - lint:ruff
      - lint:mypy
      - lint:dead
      - lint:complexity
      - lint:dup
      - lint:security

  test:
    desc: Unit tests with coverage
    cmds:
      - uv run pytest --cov=src/robots --cov-report=term-missing --cov-fail-under=85

  quality:
    desc: format + lint + test + audit (run before every commit/push)
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: audit

  check:
    desc: Non-mutating gate for CI (no --fix, no rewrite)
    cmds:
      - uv run black --check src tests
      - task: lint
      - task: test

  run:clef:
    desc: Start the local Clef SystemOne service (spike 001)
    dir: spikes/001-clef-local
    cmds:
      - ./serve.sh

  # ---- ADR-010: worlds / volumes / e2e playground -------------------------
  # world= is the WORLD_KIND: debug (default) | test | prod-NAME.

  world:up:
    desc: 'Compose up the world stack (MariaDB + worldfeed [+ rAthena profile]) for world= (default debug)'
    cmds:
      - WORLD_KIND='{{.world|default "debug"}}' bash scripts/world.sh up
    vars:
      world: '{{.world|default "debug"}}'

  world:down:
    desc: Compose down the world stack (volume kept)
    cmds:
      - WORLD_KIND='{{.world|default "debug"}}' bash scripts/world.sh down

  world:wipe:
    desc: 'Wipe a world (down -v + volume rm); REFUSES prod-* unless FORCE=1'
    cmds:
      - WORLD_KIND='{{.world|default "debug"}}' FORCE='${FORCE:-0}' bash scripts/world.sh wipe

  world:status:
    desc: Show world stack status (services, volume, ports)
    cmds:
      - WORLD_KIND='{{.world|default "debug"}}' bash scripts/world.sh status

  e2e:
    desc: 'Full-stack e2e (ADR-010 criterion 5): clean test world -> seed -> bots -> ticks -> assertions. TICKS=120 KEEP=0 CLEF_URL= '
    cmds:
      - bash scripts/e2e.sh

  playground:
    desc: e2e with KEEP=1, then point you at the dashboard (fast dev loop)
    cmds:
      - KEEP=1 bash scripts/e2e.sh
      - echo
      - echo "Playground is up ->"
      - echo "  dashboard (Rust, mock feed) http://127.0.0.1:8401"
      - echo "  worldfeed (Python, live)    http://127.0.0.1:8400"

  bench:decisions:
    desc: Benchmark decision backends (ADR-012). Vars, e.g. backends=cloudflare-flash,cloudflare-27b runs=10
    vars:
      BACKENDS: "{{.backends | default \"cloudflare-flash,cloudflare-27b\"}}"
      RUNS: "{{.runs | default \"10\"}}"
    cmds:
      - cd spikes/bench && python3 bench_framework.py --backends {{.BACKENDS}} --runs {{.RUNS}} --json-out RESULTS.json
      - echo "Compare with spikes/bench/RESULTS.md (append notable rows there)"
